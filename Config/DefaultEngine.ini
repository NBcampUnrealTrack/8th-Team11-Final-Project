[/Script/SteamSockets.SteamSocketsNetDriver]
; 이 드라이버가 쓸 커넥션 클래스. USteamSocketsNetDriver는 생성자에서 NetConnectionClass를
; 지정하지 않으므로(SteamSocketsNetDriver.cpp) 여기서 주지 않으면 기본 UNetConnection이 붙어
; SteamID 주소를 다루지 못한다.
NetConnectionClassName="/Script/SteamSockets.SteamSocketsNetConnection"

; 차량이 서버 틱에서만 이동을 계산하고 클라는 무브먼트 리플리케이션만 받는 구조라,
; 기본 틱레이트/대역폭 제한에서는 2인 이상일 때 위치 갱신 간격이 벌어져 뚝뚝 끊겨 보인다.
; 근본 해결(차선 상태 복제 + 클라 시뮬레이션)은 별도 작업이고, 이건 그 전 임시 완화용 튜닝이다.
NetServerMaxTickRate=60
MaxClientRate=100000
MaxInternetClientRate=100000

; SteamSocketsNetDriver가 초기화 실패하면 IpNetDriver로 폴백하므로(NetDriverDefinitions 참고) 그쪽도 같이 맞춘다.
[/Script/OnlineSubsystemUtils.IpNetDriver]
NetServerMaxTickRate=60
MaxClientRate=100000
MaxInternetClientRate=100000

[ConsoleVariables]
net.AllowPIESeamlessTravel=1
; 프레임 제한 A/B 테스트용 (60 / 144 / 무제한 3종 비교) - 다른 값으로 테스트할 땐 이 줄만 바꾼다.
; 실제 적용은 CWGameInstance::Init()에서 이 값을 읽어 코드로 강제 설정한다(패키징에 자동 반영
; 안 되던 문제 우회, 2026-09-14) - 값만 바꾸면 재빌드 없이 재패키징만으로 반영된다.
t.MaxFPS=60
; net.IpConnectionDisableResolution은 여기 두면 안 된다 - ECVF_Cheat 플래그가 붙어 있어서
; 프로젝트 ini의 [ConsoleVariables] 섹션으로는 못 켠다(엔진이 ensure()를 던지며 설정 자체를
; 무시함 - ConfigUtilities.cpp의 OnSetCVarFromIniEntry 확인). USteamNetDriver 호환성 문제 때문에
; 이 CVar가 필요한 이유는 CWGameInstance::Init()의 주석 참고 - 거기서 코드로 직접 설정한다.


; 트래픽 C++ 클래스에 CW 접두사를 붙이면서 이름이 바뀌었다.
; 이 리다이렉트가 없으면 이전 이름으로 저장된 BP/맵(BP_Vehicle 계열, BP_TrafficLane,
; BP_SidewalkLane, BP_VehicleSpawner, Prototype 및 Dev 맵의 배치 인스턴스)이 로드에 실패한다.
; 팀원 전원이 에셋을 한 번 열고 다시 저장하면 참조가 새 이름으로 갱신되므로, 그 뒤에는 지워도 된다.
