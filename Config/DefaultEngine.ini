; net.IpConnectionDisableResolution은 여기 두면 안 된다 - ECVF_Cheat 플래그가 붙어 있어서
; 프로젝트 ini의 [ConsoleVariables] 섹션으로는 못 켠다(엔진이 ensure()를 던지며 설정 자체를
; 무시함 - ConfigUtilities.cpp의 OnSetCVarFromIniEntry 확인). USteamNetDriver 호환성 문제 때문에
; 이 CVar가 필요한 이유는 CWGameInstance::Init()의 주석 참고 - 거기서 코드로 직접 설정한다.


; 트래픽 C++ 클래스에 CW 접두사를 붙이면서 이름이 바뀌었다.
; 이 리다이렉트가 없으면 이전 이름으로 저장된 BP/맵(BP_Vehicle 계열, BP_TrafficLane,
; BP_SidewalkLane, BP_VehicleSpawner, Prototype 및 Dev 맵의 배치 인스턴스)이 로드에 실패한다.
; 팀원 전원이 에셋을 한 번 열고 다시 저장하면 참조가 새 이름으로 갱신되므로, 그 뒤에는 지워도 된다.
