+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")
; 스팀 로그인 경로(ActivePlatform=Steam)에서 GameNetDriver(EOS P2P)로 리슨/연결을 못 여는 문제는
; 별도 NetDriverDefinition을 추가하는 대신, CWGameInstance::ApplyNetDriverClassForActivePlatform()이
; 트래블 직전마다 위 "GameNetDriver" 정의의 DriverClassName 자체를 런타임에 바꿔치기하는 방식으로 처리한다
; (호스트 Listen()과 참가자 InitNetDriver()가 둘 다 "GameNetDriver"라는 정의 이름을 하드코딩해서 찾기 때문에,
; 별도 이름의 정의를 미리 등록해두는 방식은 두 함수 내부의 자체 CreateNamedNetDriver 호출과 이름이
; 충돌해 NetDriverCreateFailure로 실패한다 - 실기 테스트로 확인, 폐기).
GameUserSettingsClassName=/Script/Crosswalk.CWGameUserSettings

[/Script/SocketSubsystemEOS.NetDriverEOSBase]
bIsUsingP2PSockets=true
; 차량이 서버 틱에서만 이동을 계산하고 클라는 무브먼트 리플리케이션만 받는 구조라,
; 기본 틱레이트/대역폭 제한에서는 2인 이상일 때 위치 갱신 간격이 벌어져 뚝뚝 끊겨 보인다.
; 근본 해결(차선 상태 복제 + 클라 시뮬레이션)은 별도 작업이고, 이건 그 전 임시 완화용 튜닝이다.
