; ---------------------------------------------------------------------------
; Steam online setup (EOS 완전히 제거 - 2026-09-10)
; ---------------------------------------------------------------------------
[OnlineSubsystem]
DefaultPlatformService=Steam
; 로컬에서 혼자 세션/UI 로직만 빠르게 확인하고 싶으면 여기만 Null로 바꾸고 멀티 PIE로 테스트한다
; (코드 수정 불필요 - CWGameInstance::IsLanOnlySubsystem이 이 값을 보고 LAN/온라인을 자동 분기).
; 같은 스팀 계정으로는 인스턴스 2개를 띄워도 혼자 검색/참가 테스트가 안 된다(엔진 소스 확인 -
; OnlineAsyncTaskManagerSteam.cpp의 OnLobbyDataUpdate가 요청자와 로비 소유자의 SteamID가 같으면
; 콜백을 버림) - Null은 이 제약이 없다. 실제 테스트/커밋 전엔 반드시 Steam으로 되돌릴 것.

[OnlineSubsystemSteam]
bEnabled=true
SteamDevAppId=480
; 응답 없는 로비의 상세 데이터 대기가 재검색을 막지 않도록 내부 대기를 제한함
; 방 목록 검색의 5초 타임아웃보다 먼저 완료되도록 4초로 설정함
OnlineAsyncTaskSteamFindLobbiesBaseTimeout=4.0
; NAT 뒤에 있는 팀원끼리 직결이 안 되면 밸브 릴레이 서버를 경유한다 - 각자 집에서 붙을 때 필수.
; SteamSockets는 이 키를 [SocketSubsystemSteamIP]가 아니라 여기에서 읽는다
; (SteamSocketsSubsystem.cpp의 FSteamSocketsSubsystem::Init 확인). 이 값이 true여야
; IsUsingRelayNetwork()가 켜지고, 그래야 리슨 서버가 IP가 아니라 SteamID(P2P) 주소로 뜬다
; (SteamSocketsNetDriver.cpp의 bIsUsingSteamAddrs 분기).
bAllowP2PPacketRelay=true

